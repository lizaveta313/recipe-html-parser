services:
  postgres:
    image: postgres:16-alpine
    container_name: recipe-parser-postgres
    environment:
      POSTGRES_DB: recipe_parser
      POSTGRES_USER: recipe_parser
      POSTGRES_PASSWORD: recipe_parser
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipe_parser -d recipe_parser"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: recipe-parser-backend
    environment:
      DATABASE_URL: postgresql+psycopg://recipe_parser:recipe_parser@postgres:5432/recipe_parser
      FRONTEND_URL: http://localhost:3000
      MAX_HTML_SIZE_BYTES: 2000000
      HTTP_TIMEOUT_SECONDS: 10
      AUTO_CREATE_TABLES: "true"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: recipe-parser-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
